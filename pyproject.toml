[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name="repair-framework-Sonzakir"
version="0.0.1"
authors = [
    {name = "Fazli Soner Kiraz" , email="fazli.kiraz@ruhr-uni-bochum.de"}
]
readme="README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha" ,
    "Programming Language :: Python"
]
dependencies = []

[project.urls]
Repository = "https://github.com/rub-sq-teaching-repair-2026/repair-framework-Sonzakir.git"

[tool.setuptools.packages.find]
where=["src"]

[project.scripts]
apr-framework = "apr_framework.__main__:app"